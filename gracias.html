<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensaje enviado | PUBLI SHOP LEÓN GTO</title>
    <meta name="description" content="Gracias por contactar a PUBLI SHOP LEÓN GTO. Tu mensaje ha sido enviado correctamente.">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="assets/images/logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .thanks-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 24px;
            background: var(--darker);
        }
        .thanks-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--white);
            margin: 0 auto 30px;
            animation: scaleIn 0.5s ease;
        }
        .thanks-section h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 16px;
        }
        .thanks-section p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 500px;
            margin: 0 auto 30px;
        }
        .thanks-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar scrolled" id="navbar">
        <div class="container nav-container">
            <a href="index.html#inicio" class="logo">
                <img src="assets/images/logo.jpg" alt="PUBLI SHOP LEÓN GTO Logo">
                <span>PUBLI SHOP LEÓN GTO</span>
            </a>
        </div>
    </nav>

    <!-- Thanks Section -->
    <section class="thanks-section">
        <div class="container">
            <div class="thanks-icon">
                <i class="fas fa-check"></i>
            </div>
            <h1>¡Mensaje <span class="gradient-text">enviado!</span></h1>
            <p>Tu mensaje fue enviado por WhatsApp. Si no se abrió automáticamente, regresa y vuelve a intentarlo. Te responderemos lo antes posible, generalmente en menos de 24 horas.</p>
            <div class="thanks-buttons">
                <a href="index.html" class="btn btn-primary btn-lg">
                    <i class="fas fa-arrow-left"></i> Regresar al inicio
                </a>
                <a href="https://wa.me/524778411655?text=Hola%20PUBLI%20SHOP%20LE%C3%93N%20GTO,%20quiero%20seguir%20cotizando" class="btn btn-outline btn-lg" target="_blank">
                    <i class="fab fa-whatsapp"></i> Escribir por WhatsApp
                </a>
            </div>
        </div>
    </section>

</html>

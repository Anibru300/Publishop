name: Publicaciones automáticas en Facebook

on:
  schedule:
    # 16:00 UTC = 10:00 a.m. hora de México (aproximado)
    - cron: '0 16 * * *'
    # 00:00 UTC = 6:00 p.m. hora de México (aproximado)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    
    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests python-dotenv

    - name: Crear archivo .env con secretos
      working-directory: ./scripts
      env:
        PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      run: |
        python3 -c "
        import os
        page_id = os.environ['PAGE_ID'].strip()
        token = os.environ['PAGE_ACCESS_TOKEN'].strip()
        with open('.env', 'w', encoding='utf-8') as f:
            f.write(f'PAGE_ID={page_id}\n')
            f.write(f'PAGE_ACCESS_TOKEN={token}\n')
        print(f'Archivo .env creado')
        print(f'PAGE_ID: {page_id}')
        print(f'TOKEN longitud: {len(token)}')
        print(f'TOKEN inicio: {token[:20]}')
        print(f'TOKEN final: {token[-10:]}')
        "

    - name: Verificar calendario
      working-directory: ./scripts
      run: |
        echo "Día UTC actual: $(date -u +%A)"
        echo "Hora UTC actual: $(date -u +%H:%M)"
        python -c "import json; data=json.load(open('content_calendar.json')); print('Total de posts en calendario:', len(data['calendar']))"

    - name: Determinar franja horaria
      id: slot
      run: |
        HOUR=$(date -u +%H)
        if [ "$HOUR" -ge 8 ] && [ "$HOUR" -lt 20 ]; then
          echo "slot=morning" >> $GITHUB_OUTPUT
          echo "🌅 Franja horaria: morning (publicación matutina)"
        else
          echo "slot=evening" >> $GITHUB_OUTPUT
          echo "🌙 Franja horaria: evening (publicación vespertina)"
        fi

    - name: Publicar en Facebook
      working-directory: ./scripts
      run: |
        python run_automation.py --posts --time-slot ${{ steps.slot.outputs.slot }}

    - name: Guardar estadísticas
      working-directory: ./scripts
      run: |
        python run_automation.py --insights

name: Publicaciones automáticas en Facebook

on:
  schedule:
    # 16:00 UTC = 10:00 a.m. hora de México (aproximado)
    - cron: '0 16 * * *'
    # 00:00 UTC = 6:00 p.m. hora de México (aproximado)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    
    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests python-dotenv

    - name: Crear archivo .env con secretos
      working-directory: ./scripts
      run: |
        echo "PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}" > .env
        echo "PAGE_ACCESS_TOKEN=${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}" >> .env
        echo "Archivo .env creado"
        echo "PAGE_ID tiene ${#PAGE_ID} caracteres"
        echo "TOKEN tiene ${#FACEBOOK_PAGE_ACCESS_TOKEN} caracteres"
      env:
        PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

    - name: Verificar calendario
      working-directory: ./scripts
      run: |
        echo "Día UTC actual: $(date -u +%A)"
        python -c "import json; data=json.load(open('content_calendar.json')); print(f'Total de posts en calendario: {len(data[\"calendar\"])}')"

    - name: Publicar en Facebook
      working-directory: ./scripts
      run: |
        python run_automation.py --posts

    - name: Guardar estadísticas
      working-directory: ./scripts
      run: |
        python run_automation.py --insights

name: Publicaciones automáticas en Facebook

on:
  schedule:
    # 16:00 UTC = 10:00 a.m. hora de México (aproximado)
    - cron: '0 16 * * *'
    # 00:00 UTC = 6:00 p.m. hora de México (aproximado)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Permite ejecutar manualmente desde GitHub
    inputs:
      day:
        description: 'Día de prueba (opcional, ej: Viernes). Dejar vacío para usar el día actual.'
        required: false
        default: ''

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    
    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt

    - name: Crear archivo .env con secretos
      working-directory: ./scripts
      env:
        PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      run: |
        python3 -c "
        import os
        page_id = os.environ['PAGE_ID'].strip()
        token = os.environ['PAGE_ACCESS_TOKEN'].strip()
        with open('.env', 'w', encoding='utf-8') as f:
            f.write(f'PAGE_ID={page_id}\n')
            f.write(f'PAGE_ACCESS_TOKEN={token}\n')
        print('Archivo .env creado')
        print('PAGE_ID configurado:', 'Sí' if page_id else 'No')
        print('PAGE_ACCESS_TOKEN configurado:', 'Sí' if token else 'No')
        "

    - name: Verificar calendario y entorno
      working-directory: ./scripts
      env:
        TZ: America/Mexico_City
      run: |
        echo "Día UTC actual: $(date -u +%A)"
        echo "Hora UTC actual: $(date -u +%H:%M)"
        echo "Día México: $(date +%A)"
        echo "Hora México: $(date +%H:%M)"
        python run_automation.py --validate

    - name: Determinar franja horaria
      id: slot
      env:
        TZ: America/Mexico_City
      run: |
        HOUR=$(date +%H)
        if [ "$HOUR" -ge 0 ] && [ "$HOUR" -lt 14 ]; then
          echo "slot=morning" >> $GITHUB_OUTPUT
          echo "🌅 Franja horaria: morning (publicación matutina, hora de México: $HOUR:00)"
        else
          echo "slot=evening" >> $GITHUB_OUTPUT
          echo "🌙 Franja horaria: evening (publicación vespertina, hora de México: $HOUR:00)"
        fi

    - name: Publicar en Facebook
      working-directory: ./scripts
      run: |
        if [ -n "${{ github.event.inputs.day }}" ]; then
          python run_automation.py --posts --time-slot ${{ steps.slot.outputs.slot }} --day ${{ github.event.inputs.day }}
        else
          python run_automation.py --posts --time-slot ${{ steps.slot.outputs.slot }}
        fi

    - name: Guardar estadísticas
      working-directory: ./scripts
      run: |
        python run_automation.py --insights

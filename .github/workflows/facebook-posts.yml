name: Publicaciones automáticas en Facebook

on:
  schedule:
    # 16:00 UTC = 10:00 a.m. hora de México (aproximado)
    - cron: '0 16 * * *'
    # 00:00 UTC = 6:00 p.m. hora de México (aproximado)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    
    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests python-dotenv

    - name: Crear archivo .env con secretos
      working-directory: ./scripts
      env:
        PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      run: |
        python - <<PY
        import os
        with open('.env', 'w', encoding='utf-8') as f:
            f.write(f"PAGE_ID={os.environ['PAGE_ID']}\n")
            f.write(f"PAGE_ACCESS_TOKEN={os.environ['PAGE_ACCESS_TOKEN']}\n")
        print(f"Archivo .env creado")
        print(f"PAGE_ID tiene {len(os.environ['PAGE_ID'])} caracteres")
        print(f"TOKEN tiene {len(os.environ['PAGE_ACCESS_TOKEN'])} caracteres")
        PY

    - name: Verificar calendario
      working-directory: ./scripts
      run: |
        echo "Día UTC actual: $(date -u +%A)"
        python -c "import json; data=json.load(open('content_calendar.json')); print(f'Total de posts en calendario: {len(data[\"calendar\"])}')"

    - name: Publicar en Facebook
      working-directory: ./scripts
      run: |
        python run_automation.py --posts

    - name: Guardar estadísticas
      working-directory: ./scripts
      run: |
        python run_automation.py --insights
